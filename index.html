<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Futsal UNSS – Table de marque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1020; --panel:#121b2f; --panel2:#18233b; --line:#263552; --txt:#eef3ff; --mut:#8fa0bf;
  --A:#22c3ee; --Ad:#0e4a5c; --B:#fb923c; --Bd:#5c3011;
  --ok:#22c55e; --warn:#facc15; --bad:#ef4444;
  --big:'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
a{color:var(--A)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:.55em 1em;transition:transform .06s, background .15s}
button:active{transform:scale(.97)}
button.primary{background:var(--A);color:#04212b;border-color:var(--A);font-weight:800}
button.danger{background:#3a1216;border-color:#7a2028;color:#ffc9cc}
button.ghost{background:transparent}
button.on{background:var(--A);color:#04212b;border-color:var(--A);font-weight:700}
input,select,textarea{font:inherit;color:var(--txt);background:#0d1528;border:1px solid var(--line);border-radius:8px;padding:.5em .7em}
textarea{width:100%;min-height:150px;resize:vertical}
.hidden{display:none!important}
.mut{color:var(--mut)}
#demoBanner{background:#4a3a05;color:#ffe9a3;text-align:center;font-size:13px;padding:6px 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1f2b45;border:1px solid var(--line);padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-weight:600;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:#4a1418;border-color:#8a2530}
#toast.ok{background:#0f3d24;border-color:#1f7a45}
#print{display:none}
body.fit{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
body.fit #app{flex:1;min-height:0;overflow:auto}
body.fit .tab,body.fit .pub.big{height:100%}

/* ---------- Accueil ---------- */
.home{max-width:900px;margin:0 auto;padding:40px 16px;text-align:center}
.home h1{font-family:var(--big);font-size:clamp(48px,9vw,96px);letter-spacing:2px;margin:10px 0 0;font-weight:400}
.homeGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:36px}
.homeCard{display:block;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 16px;text-decoration:none;color:var(--txt);font-weight:800;font-size:20px}
.homeCard span{display:block;font-size:44px;margin-bottom:8px}
.homeCard small{display:block;color:var(--mut);font-weight:400;font-size:13px;margin-top:6px}

/* ---------- Tablette ---------- */
.tabLogin{max-width:420px;margin:0 auto;padding:30px 16px;text-align:center}
.codeDisplay{display:flex;gap:12px;justify-content:center;margin:24px 0}
.codeDisplay span{width:64px;height:78px;border-radius:12px;background:var(--panel);border:2px solid var(--line);font-family:var(--big);font-size:56px;display:flex;align-items:center;justify-content:center}
.codeDisplay span.f{border-color:var(--A)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keypad button{font-size:32px;padding:18px 0;font-weight:800;background:var(--panel)}
.tab{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:8px;gap:8px}
.tHead{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.tHead .seg button{padding:.5em .8em}
.tHead .tn{font-family:var(--big);font-size:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tHead .tn.A{color:var(--A)} .tHead .tn.B{color:var(--B);text-align:right}
.tGrid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0}
.tcol{display:flex;flex-direction:column;gap:6px;background:var(--panel);border-radius:14px;padding:8px;border-top:5px solid var(--A);min-height:0;overflow:auto}
.tcol.sideB{border-top-color:var(--B)}
.tPts{text-align:center;font-weight:800;font-size:18px}
.tPts b{font-family:var(--big);font-size:30px;font-weight:400;color:var(--A)}
.sideB .tPts b{color:var(--B)}
.tBtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
.tBtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:78px;background:var(--Ad);border-color:transparent;padding:6px;position:relative}
.sideB .tBtn{background:var(--Bd)}
.tBtn .e{font-size:24px;line-height:1}
.tBtn .l{font-size:14px;font-weight:600;margin-top:2px;text-align:center}
.tBtn .n{font-family:var(--big);font-size:34px;line-height:1}
.tBtn.flash{animation:flash .35s}
@keyframes flash{0%{background:#fff;color:#000}100%{}}
.tBtn.faute{background:#3b2a07;min-height:60px;flex-direction:row;gap:12px}
.tRow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tTog{padding:12px 6px;font-weight:600;background:var(--panel2)}
.tTog.on{background:#f4f4f4;color:#111;border-color:#fff}
.alert{background:#5a0f15;border:1px solid var(--bad);color:#ffd3d6;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:700;text-align:center}
.tFoot{display:flex;gap:8px;align-items:center}
.tFoot button{flex:1;padding:14px;font-weight:700;font-size:16px}
.tFoot .last{flex:2;font-size:13px;color:var(--mut);text-align:center}

/* ---------- Écran public / projection ---------- */
.pub{min-height:100vh;padding:16px;position:relative}
.pub.big{height:100vh;overflow:hidden;padding:1.5vw 2vw;display:flex;flex-direction:column}
#pubMain{flex:1;display:flex;flex-direction:column;min-height:0}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:800;letter-spacing:1px;font-size:14px;background:var(--panel2)}
.badge.live{background:#5a0f15;color:#ffb3b8}
.badge.live::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:7px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.sbTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sbTop .ttl{font-weight:800;color:var(--mut)}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2vw;margin:10px 0}
.sbTeam{font-family:var(--big);font-size:clamp(34px,7vw,64px);line-height:.95;overflow-wrap:anywhere}
.sbTeam.A{color:var(--A);text-align:right} .sbTeam.B{color:var(--B)}
.sbScore{font-family:var(--big);font-size:clamp(70px,16vw,140px);line-height:.9;background:#000;border:2px solid var(--line);border-radius:18px;padding:.05em .3em;white-space:nowrap}
.sbScore span{color:var(--mut);margin:0 .12em}
.notes{display:grid;grid-template-columns:1fr auto 1fr;gap:2vw;align-items:center;margin-bottom:10px}
.note{background:var(--panel);border-radius:14px;padding:8px 14px;border:2px solid var(--Ad);text-align:center}
.note.B{border-color:var(--Bd)}
.note small{display:block;color:var(--mut);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.note b{font-family:var(--big);font-weight:400;font-size:clamp(40px,8vw,72px);line-height:1}
.note.A b{color:var(--A)} .note.B b{color:var(--B)}
.noteMid{color:var(--mut);font-size:12px;font-weight:800;letter-spacing:1px;text-align:center;line-height:1.3}
.crit{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
.cRow{display:grid;grid-template-columns:1fr minmax(110px,auto) 1fr;gap:10px;align-items:center;background:var(--panel);border-radius:10px;padding:6px 10px}
.cA,.cB{display:flex;align-items:center;gap:8px}
.cA{justify-content:flex-end}
.cBar{flex:1;height:12px;background:#0b1325;border-radius:6px;overflow:hidden;display:flex}
.cBar i{display:block;height:100%;background:var(--A);border-radius:6px;transition:width .4s}
.cA .cBar{justify-content:flex-end}
.cB .cBar i{background:var(--B)}
.cN{font-family:var(--big);font-size:32px;min-width:44px;text-align:center;line-height:1}
.cPts{font-size:13px;color:var(--mut);min-width:48px;font-weight:600}
.cA .cPts{text-align:left} .cB .cPts{text-align:right}
.cL{text-align:center;font-weight:800;font-size:15px;line-height:1.15}
.cL small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.fRow{background:#141a26}
.dots{display:flex;gap:4px;align-items:center}
.cA .dots{flex-direction:row-reverse}
.dots i{width:18px;height:18px;border-radius:4px;border:2px solid #5b4a1a;display:block}
.dots i.on{background:var(--warn);border-color:var(--warn)}
.dots i.pen{background:var(--bad);border-color:var(--bad)}
.dots em{font-style:normal;font-weight:800;color:var(--warn)}
.pill{font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px;background:#eee;color:#111;white-space:nowrap}
.pill.tm{background:#334;color:#cde}
.penAlert{font-size:12px;font-weight:800;color:#ffb3b8}
.big .cRow{padding:.5vh 1vw}
.big .cN{font-size:clamp(28px,4.2vh,56px)}
.big .cL{font-size:clamp(14px,2.2vh,26px)}
.big .cBar{height:clamp(10px,1.6vh,20px)}
.big .sbTeam{font-size:clamp(40px,7.5vw,150px)}
.big .sbScore{font-size:clamp(80px,13vw,260px)}
.big .note b{font-size:clamp(44px,7vh,120px)}
#qrBox{position:fixed;right:1.2vw;bottom:1.2vw;background:#fff;color:#111;border-radius:12px;padding:8px;text-align:center;font-weight:800;font-size:12px;z-index:5}
#qrBox #qr img,#qrBox #qr canvas{display:block;width:110px;height:110px}
.clTitle{font-family:var(--big);font-size:clamp(40px,6vw,90px);text-align:center;line-height:1}
.clTitle small{display:block;font-family:Inter,sans-serif;font-size:clamp(13px,1.5vw,20px);color:var(--mut);letter-spacing:1px;text-transform:uppercase;font-weight:600}
table{border-collapse:collapse;width:100%}
.clTable{margin:16px auto;max-width:1100px}
.clTable th{color:var(--mut);font-weight:600;font-size:13px;text-transform:uppercase;padding:6px;text-align:center}
.clTable td{padding:10px 8px;text-align:center;border-top:1px solid var(--line);font-size:clamp(15px,1.8vw,26px)}
.clTable td.tn{text-align:left;font-weight:800}
.clTable tr.first td{background:rgba(250,204,21,.12)}
.clTable .tot{font-family:var(--big);font-size:clamp(26px,3vw,48px);color:var(--warn)}
.nextBox{text-align:center;margin-top:10px;background:var(--panel);border-radius:14px;padding:14px;max-width:900px;margin-left:auto;margin-right:auto}
.nextBox b{font-family:var(--big);font-weight:400;font-size:clamp(28px,4vw,56px)}
.nextBox .A{color:var(--A)} .nextBox .B{color:var(--B)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}

/* ---------- Professeur ---------- */
.prof{max-width:1200px;margin:0 auto;padding:12px 16px 60px}
.pHead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 12px}
.pHead b{font-size:18px}
.pHeadBtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;gap:0;align-items:center;background:var(--panel);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:.45em .8em}
.seg button.on{background:var(--A);color:#04212b}
.seg .lbl{padding:0 8px;color:var(--mut);font-size:13px}
.pTabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.pTabs button{border:0;border-radius:10px 10px 0 0;background:transparent;padding:.7em 1.1em;color:var(--mut);font-weight:600}
.pTabs button.on{background:var(--panel);color:var(--txt);box-shadow:inset 0 -3px 0 var(--A)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.codeBig{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.codeBig .c{font-family:var(--big);font-size:84px;letter-spacing:12px;line-height:1;background:#000;border-radius:12px;padding:4px 18px;color:var(--warn)}
.liveGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.liveSide{border-top:5px solid var(--A)}
.liveSide.B{border-top-color:var(--B)}
.liveSide h3{font-family:var(--big);font-size:38px;font-weight:400;margin:0;display:flex;justify-content:space-between;align-items:baseline}
.liveSide.A h3{color:var(--A)} .liveSide.B h3{color:var(--B)}
.corr td{padding:5px 4px;border-top:1px solid var(--line)}
.corr td.n{font-family:var(--big);font-size:28px;text-align:center;width:56px}
.corr button{padding:.25em .8em;font-weight:800}
.corr .sub{color:var(--mut);font-size:12px}
.dataTable th{color:var(--mut);font-size:12px;text-transform:uppercase;text-align:left;padding:6px;font-weight:600}
.dataTable td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
.dataTable td.c,.dataTable th.c{text-align:center}
.st{font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--panel2)}
.st.live{background:#5a0f15;color:#ffb3b8} .st.done{background:#0f3d24;color:#a7f3c4}
.critEd td{padding:6px 4px;border-top:1px solid var(--line)}
.critEd input[type=text]{width:100%}
.critEd input.em{width:58px;text-align:center}
.critEd input.pt{width:90px}
.critEd .ex{color:var(--mut);font-size:13px}
.formGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.formGrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.login{max-width:380px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
.login input{width:100%;margin-top:10px}
.login button{width:100%;margin-top:14px;padding:12px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
#modal input{width:80px;text-align:center}
.qrSet{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrSet #qrSet{background:#fff;padding:8px;border-radius:8px}
.scroll{overflow-x:auto}
@media (max-width:760px){
  .liveGrid{grid-template-columns:1fr}
  .cRow{grid-template-columns:1fr 86px 1fr;gap:4px;padding:6px}
  .cPts{display:none}
  .cN{font-size:26px;min-width:30px}
  .cL{font-size:12px}
  .dots i{width:12px;height:12px}
  .tBtns{grid-template-columns:1fr}
}

/* ---------- Impression / PDF ---------- */
@media print{
  body{background:#fff;color:#000}
  body > :not(#print){display:none!important}
  #print{display:block!important;font-family:Inter,Arial,sans-serif;color:#000}
  #print h1{font-size:22px;margin:0 0 4px}
  #print h2{font-size:16px;margin:18px 0 6px;border-bottom:2px solid #000;padding-bottom:3px}
  #print table{border-collapse:collapse;width:100%;font-size:12px;page-break-inside:auto}
  #print th,#print td{border:1px solid #999;padding:4px 6px;text-align:center}
  #print td.l,#print th.l{text-align:left}
  #print tr{page-break-inside:avoid}
  #print .small{font-size:11px;color:#444}
  @page{margin:12mm}
}
</style>
</head>
<body>
<div id="demoBanner" class="hidden">⚠️ MODE DÉMONSTRATION : les données restent dans ce navigateur (testez en ouvrant plusieurs onglets). Collez votre configuration Firebase dans le fichier pour la synchronisation tablette ↔ PC.</div>
<div id="app"></div>
<div id="print"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* =====================================================================
   1) CONFIGURATION FIREBASE — collez ici le bloc donné par Firebase
      (Paramètres du projet > Vos applications > Configuration du SDK)
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBwm-7YdoNwZ14XaNh3_BtXxmWQvJo_URI",
  authDomain: "futsalleval.firebaseapp.com",
  databaseURL: "https://futsalleval-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "futsalleval",
  storageBucket: "futsalleval.firebasestorage.app",
  messagingSenderId: "1020536295851",
  appId: "1:1020536295851:web:27d41447a67c72841bc2ee"
};
/* ===================================================================== */

/* Comptes Google autorisés à piloter l'outil (espace professeur) */
const APP_VERSION = 'v3 – 14/10';
const ADMIN_EMAILS = ['florianeude@gmail.com', 'cosperec.emeric@gmail.com'];
/* Gmail ignore les points : florian.eude@ = florianeude@ */
const normEmail = e => { e = String(e || '').toLowerCase().trim(); const [u, d] = e.split('@'); return (d === 'gmail.com' || d === 'googlemail.com') ? u.replace(/\./g, '') + '@gmail.com' : e; };

const DEMO = !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('COLLER') >= 0;

/* Barème proposé par défaut (modifiable dans Réglages) */
const DEFAULT_CRITERIA = [
  { id:'passe',     emoji:'🔁', label:'Passe réussie',    points:0.1, goal:false },
  { id:'inter',     emoji:'🛡️', label:'Interception',     points:0.3, goal:false },
  { id:'horscadre', emoji:'↗️', label:'Tir hors cadre',   points:0.2, goal:false },
  { id:'cadre',     emoji:'🎯', label:'Tir cadré',        points:0.5, goal:false },
  { id:'but',       emoji:'⚽', label:'But marqué',       points:2,   goal:true  },
  { id:'arret',     emoji:'🧤', label:'Arrêt du gardien', points:0.5, goal:false }
];
const DEFAULT_CONFIG = { title:'Futsal UNSS', format:'2 × 10 min', faultThreshold:3, criteria:DEFAULT_CRITERIA, teams:[] };

/* ---------------- Utilitaires ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = v => Array.isArray(v) ? v.filter(x => x != null) : (v && typeof v === 'object' ? Object.values(v) : []);
const fmt = n => (Math.round((n || 0) * 10) / 10).toLocaleString('fr-FR', { minimumFractionDigits:1, maximumFractionDigits:1 });
const fmtP = n => Number(n || 0).toLocaleString('fr-FR', { maximumFractionDigits:2 });
const hOf = e => (e && Number(e.h) === 2) ? 2 : 1;
let toastTimer;
function toast(msg, kind) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + (kind || '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 2600);
}
function cfg() { return Object.assign({}, DEFAULT_CONFIG, S.config || {}); }
function criteria() { return arr(cfg().criteria); }
function teams() { return arr(cfg().teams); }
function spectatorURL() { return location.href.split('#')[0] + '#direct'; }
function makeQR(el, size) {
  if (!el) return; el.innerHTML = '';
  if (window.QRCode) new QRCode(el, { text: spectatorURL(), width: size, height: size, colorDark:'#000000', colorLight:'#ffffff' });
  else el.textContent = spectatorURL();
}

/* ---------------- Couche base de données ---------------- */
function FireDB() {
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  return {
    on(path, cb, onErr) {
      const r = db.ref(path); const h = s => cb(s.val());
      r.on('value', h, e => { if (onErr) onErr(e); else console.warn(path, e); });
      return () => r.off('value', h);
    },
    once: p => db.ref(p).once('value').then(s => s.val()),
    set: (p, v) => db.ref(p).set(v),
    update: obj => db.ref().update(obj),
    push(p, v) { const r = db.ref(p).push(); return r.set(v).then(() => r.key); },
    remove: p => db.ref(p).remove(),
    async checkCode(code) {
      try { await db.ref('live/tab/' + code).once('value'); return true; } catch (e) { return false; }
    }
  };
}
function LocalDB() {
  const KEY = 'futsalDemoDB';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  let tree = load(); const subs = new Set();
  const parts = p => p.split('/').filter(Boolean);
  const clone = v => v == null ? null : JSON.parse(JSON.stringify(v));
  function get(p) { let n = tree; for (const k of parts(p)) { if (n == null || typeof n !== 'object') return null; n = n[k]; } return n === undefined ? null : clone(n); }
  function setAt(p, v) {
    const ks = parts(p); if (!ks.length) { tree = v || {}; return; }
    let n = tree;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof n[ks[i]] !== 'object' || n[ks[i]] === null) n[ks[i]] = {}; n = n[ks[i]]; }
    if (v === null || v === undefined) delete n[ks[ks.length - 1]]; else n[ks[ks.length - 1]] = clone(v);
  }
  function notify() { subs.forEach(s => { const v = get(s.path); const j = JSON.stringify(v); if (j !== s.last) { s.last = j; s.cb(v); } }); }
  function save() { localStorage.setItem(KEY, JSON.stringify(tree)); notify(); }
  window.addEventListener('storage', e => { if (e.key === KEY) { tree = load(); notify(); } });
  let lastTs = 0, cnt = 0;
  const pushKey = () => { const t = Date.now(); cnt = t === lastTs ? cnt + 1 : 0; lastTs = t; return t.toString(36).padStart(9, '0') + cnt.toString(36).padStart(3, '0') + Math.random().toString(36).slice(2, 6); };
  return {
    on(path, cb) { const s = { path, cb, last: JSON.stringify(get(path)) }; subs.add(s); setTimeout(() => cb(get(path))); return () => subs.delete(s); },
    once: p => Promise.resolve(get(p)),
    set(p, v) { setAt(p, v); save(); return Promise.resolve(); },
    update(obj) { for (const k in obj) setAt(k, obj[k]); save(); return Promise.resolve(); },
    push(p, v) { const k = pushKey(); setAt(p + '/' + k, v); save(); return Promise.resolve(k); },
    remove(p) { setAt(p, null); save(); return Promise.resolve(); },

  };
}

/* ---------------- Calculs ---------------- */
function emptySide() { return { c:{}, f:{h1:0,h2:0}, card:{h1:0,h2:0}, tm:{h1:0,h2:0} }; }
function normAgg(a) {
  const o = { A: emptySide(), B: emptySide() }; if (!a) return o;
  for (const s of ['A', 'B']) {
    const x = a[s] || {}; o[s].c = Object.assign({}, x.c || {});
    for (const k of ['f', 'card', 'tm']) o[s][k] = { h1: (x[k] && x[k].h1) || 0, h2: (x[k] && x[k].h2) || 0 };
  }
  return o;
}
function aggregate(events) {
  const o = { A: emptySide(), B: emptySide() };
  for (const e of Object.values(events || {})) {
    const T = o[e && e.t]; if (!T) continue; const h = 'h' + hOf(e);
    if (e.k === '_faute') T.f[h]++; else if (e.k === '_carton') T.card[h]++; else if (e.k === '_tm') T.tm[h]++;
    else T.c[e.k] = (T.c[e.k] || 0) + 1;
  }
  return o;
}
const pts = side => criteria().reduce((s, c) => s + (side.c[c.id] || 0) * (Number(c.points) || 0), 0);
const goals = side => criteria().filter(c => c.goal).reduce((s, c) => s + (side.c[c.id] || 0), 0);
function sortedMatches() {
  return Object.entries(S.matches || {}).map(([id, m]) => Object.assign({ id }, m)).sort((a, b) => (a.order || 0) - (b.order || 0));
}
function nextMatch() { return sortedMatches().find(m => m.status === 'todo'); }
function standings() {
  const map = new Map();
  const add = n => { if (!map.has(n)) map.set(n, { name:n, played:0, pts:0, gf:0, ga:0, w:0, d:0, l:0, c:{}, cards:0, fouls:0 }); return map.get(n); };
  teams().forEach(add);
  for (const m of sortedMatches()) {
    if (m.status !== 'done' || !m.result) continue;
    const agg = normAgg(m.result.agg);
    for (const [s, n, o] of [['A', m.teamA, 'B'], ['B', m.teamB, 'A']]) {
      const T = add(n), me = agg[s], op = agg[o];
      T.played++; T.pts += pts(me);
      const g1 = goals(me), g2 = goals(op); T.gf += g1; T.ga += g2;
      if (g1 > g2) T.w++; else if (g1 === g2) T.d++; else T.l++;
      for (const k in me.c) T.c[k] = (T.c[k] || 0) + me.c[k];
      T.cards += me.card.h1 + me.card.h2; T.fouls += me.f.h1 + me.f.h2;
    }
  }
  const list = [...map.values()].sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name));
  let prev = null, rank = 0;
  list.forEach((t, i) => { const k = Math.round(t.pts * 100); if (k !== prev) rank = i + 1; prev = k; t.rank = rank; });
  return list;
}
function roundRobin(list) {
  const t = [...list]; if (t.length % 2) t.push(null);
  const n = t.length, out = [];
  for (let r = 0; r < n - 1; r++) {
    for (let i = 0; i < n / 2; i++) { const a = t[i], b = t[n - 1 - i]; if (a && b) out.push(r % 2 ? [b, a] : [a, b]); }
    t.splice(1, 0, t.pop());
  }
  return out;
}

function lastKey(events, filter) { const ks = Object.keys(events || {}).filter(k => !filter || filter(events[k])).sort(); return ks[ks.length - 1]; }

    </div>`;
  }

  return `<div class="card"><div class="codeBig">

  </div>

/* ---------------- Gestion des clics ---------------- */
document.addEventListener('submit', async e => {
  if (e.target.id !== 'loginForm') return; e.preventDefault();
  try { await Auth.login(); }
  catch (err) {
    if (err && err.code === 'auth/unauthorized-domain') toast('Ajoutez ce site dans Firebase : Authentication > Paramètres > Domaines autorisés', 'bad');
    else if (err && err.code === 'auth/popup-blocked') toast('Autorisez les fenêtres pop-up pour ce site, puis réessayez', 'bad');
    else if (!(err && err.code === 'auth/popup-closed-by-user')) toast('Connexion impossible : ' + ((err && err.message) || err), 'bad');
  }
});

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, ds = b.dataset;
  try {
    switch (a) {
      /* Tablette */
      case 'key': {
        if (ds.k === 'C') keypad = ''; else if (ds.k === '⌫') keypad = keypad.slice(0, -1); else if (keypad.length < 4) keypad += ds.k;
        renderTablet(); if (keypad.length === 4) tabletLogin(keypad); break;
      }
      case 'tadd': {
        b.classList.add('flash'); if (navigator.vibrate) navigator.vibrate(25);
        await addEvent(S.tabCode, ds.t, ds.k, Number((S.tabData || {}).half) === 2 ? 2 : 1); break;
      }
      case 'ttog': await toggleEvent(S.tabCode, (S.tabData || {}).events, ds.t, ds.k, Number((S.tabData || {}).half) === 2 ? 2 : 1); break;
      case 'thalf': await DB.set('live/tab/' + S.tabCode + '/half', Number(ds.h)); break;
      case 'tundo': {
        const k = await removeLast(S.tabCode, (S.tabData || {}).events);
        toast(k ? 'Dernière action annulée' : 'Rien à annuler'); break;
      }

      /* Professeur : général */
      case 'logout': await Auth.logout(); break;
      case 'ptab': S.adminTab = ds.v; renderProfTop(); renderProfBody(); break;
      case 'openScreen': window.open(location.href.split('#')[0] + '#ecran', 'futsalEcran'); break;
      case 'display': await DB.set('live/display', ds.v); toast(ds.v === 'match' ? 'L\'écran affiche le match' : 'L\'écran affiche le classement', 'ok'); break;
      case 'toggleCode': S.showCode = !S.showCode; renderProfBody(); break;

      /* Match en cours */
      case 'start': {
        if (S.current) { toast('Terminez d\'abord le match en cours', 'bad'); break; }
        const m = S.matches[ds.id]; if (!m) break;
        let code; do { code = String(Math.floor(1000 + Math.random() * 9000)); } while (code === S.code);
        lastPubJson = '';
        await DB.update({
          'secret/code': code,
          ['live/tab/' + code]: { half: 1 },
          'live/current': { matchId: ds.id, teamA: m.teamA, teamB: m.teamB, startedAt: Date.now() },
          'live/public': { matchId: ds.id, teamA: m.teamA, teamB: m.teamB, half: 1, status: 'live', updatedAt: Date.now() },
          'live/display': 'match',
          ['matches/' + ds.id + '/status']: 'live'
        });
        S.showCode = true; S.adminTab = 'live'; renderProfTop(); renderProfBody();
        toast('Match lancé · code tablette : ' + code, 'ok'); break;
      }
      case 'ahalf': if (S.code) await DB.set('live/tab/' + S.code + '/half', Number(ds.h)); break;
      case 'aplus': if (S.code) await addEvent(S.code, ds.t, ds.k, ds.h ? Number(ds.h) : (S.tab && Number(S.tab.half) === 2 ? 2 : 1)); break;
      case 'aminus': if (S.code) await removeLast(S.code, S.tab && S.tab.events, ev => ev.t === ds.t && ev.k === ds.k && (!ds.h || hOf(ev) === Number(ds.h))); break;
      case 'atog': if (S.code) await toggleEvent(S.code, S.tab && S.tab.events, ds.t, ds.k, Number(ds.h)); break;
      case 'end': {
        const cur = S.current; if (!cur) break;
        if (!confirm(`Terminer et enregistrer le match ${cur.teamA} – ${cur.teamB} ?`)) break;
        const agg = aggregate(S.tab && S.tab.events), half = S.tab && Number(S.tab.half) === 2 ? 2 : 1, code = S.code;
        const u = {
          ['matches/' + cur.matchId + '/status']: 'done',
          ['matches/' + cur.matchId + '/result']: { agg, endedAt: Date.now() },
          'live/public': { matchId: cur.matchId, teamA: cur.teamA, teamB: cur.teamB, half, agg, status: 'ended', updatedAt: Date.now() },
          'live/current': null, 'secret/code': null
        };
        if (code) u['live/tab/' + code] = null;
        await DB.update(u);
        toast(`Match enregistré : ${cur.teamA} ${fmt(pts(agg.A))} pts · ${cur.teamB} ${fmt(pts(agg.B))} pts`, 'ok'); break;
      }
      case 'cancel': {
        const cur = S.current; if (!cur) break;
        if (!confirm('Annuler ce match ? Les actions saisies seront perdues et le match repassera « à jouer ».')) break;
        const u = { ['matches/' + cur.matchId + '/status']: 'todo', 'live/current': null, 'secret/code': null, 'live/public': null };
        if (S.code) u['live/tab/' + S.code] = null;
        await DB.update(u); toast('Match annulé'); break;
      }

      /* Équipes & matchs */
      case 'saveTeams': {
        const list = [...new Set($('#teamsInput').value.split('\n').map(s => s.trim()).filter(Boolean))];
        await DB.set('config/teams', list); toast(list.length + ' équipe(s) enregistrée(s)', 'ok'); break;
      }
      case 'genPoule': {
        const list = [...new Set($('#teamsInput').value.split('\n').map(s => s.trim()).filter(Boolean))];
        if (list.length < 2) { toast('Il faut au moins 2 équipes', 'bad'); break; }
        const ms = sortedMatches(), todo = ms.filter(m => m.status === 'todo');
        if (todo.length && !confirm(`Remplacer les ${todo.length} match(s) « à jouer » par la poule complète ? (les matchs terminés sont conservés)`)) break;
        const played = new Set(ms.filter(m => m.status !== 'todo').map(m => [m.teamA, m.teamB].sort().join('|')));
        const u = { 'config/teams': list }; todo.forEach(m => u['matches/' + m.id] = null);
        let order = ms.reduce((mx, m) => Math.max(mx, m.order || 0), 0), n = 0;
        roundRobin(list).forEach(([x, y], i) => {
          if (played.has([x, y].sort().join('|'))) return;
          u['matches/m' + Date.now().toString(36) + i] = { teamA: x, teamB: y, order: ++order, status: 'todo' }; n++;
        });
        await DB.update(u); toast(n + ' match(s) générés', 'ok'); break;
      }
      case 'addMatch': {
        const x = $('#selA').value, y = $('#selB').value;
        if (!x || !y || x === y) { toast('Choisissez deux équipes différentes', 'bad'); break; }
        const order = sortedMatches().reduce((mx, m) => Math.max(mx, m.order || 0), 0) + 1;
        await DB.set('matches/m' + Date.now().toString(36), { teamA: x, teamB: y, order, status: 'todo' }); toast('Match ajouté', 'ok'); break;
      }
      case 'delMatch': if (confirm('Supprimer ce match ?')) await DB.remove('matches/' + ds.id); break;
      case 'editMatch': openEdit(ds.id); break;
      case 'closeModal': closeModal(); break;
      case 'saveEdit': {
        const u = {};
        document.querySelectorAll('#modal input[data-s]').forEach(inp => { u['matches/' + ds.id + '/result/agg/' + inp.dataset.s + '/c/' + inp.dataset.k] = Math.max(0, parseInt(inp.value, 10) || 0); });
        await DB.update(u); closeModal(); toast('Match corrigé', 'ok'); break;
      }
      case 'newDay': {
        if (S.current) { toast('Terminez d\'abord le match en cours', 'bad'); break; }
        if (!confirm('Archiver tous les matchs de la journée et repartir à zéro ?')) break;
        const now = new Date(), key = now.toISOString().slice(0, 16).replace(/[:T]/g, '-');
        await DB.set('archives/' + key, { matches: S.matches || {}, teams: teams(), criteria: criteria() });
        await DB.update({ matches: null, 'live/public': null, 'live/display': 'match' });
        toast('Journée archivée', 'ok'); break;
      }

      /* Bilan */
      case 'pdf': exportPDF(); break;

      /* Réglages */
      case 'critAdd': readCritRows(); critEdit.push({ id: 'c' + Date.now().toString(36), emoji: '⭐', label: '', points: 0.5, goal: false }); renderCritRows(); break;
      case 'critDel': readCritRows(); critEdit.splice(Number(ds.i), 1); renderCritRows(); break;
      case 'critReset': if (confirm('Revenir au barème proposé ?')) { critEdit = DEFAULT_CRITERIA.map(x => Object.assign({}, x)); renderCritRows(); } break;
      case 'saveSettings': {
        readCritRows();
        if (critEdit.some(c => !c.label)) { toast('Chaque critère doit avoir un nom', 'bad'); break; }
        if (!critEdit.length) { toast('Il faut au moins un critère', 'bad'); break; }
        await DB.update({
          'config/title': $('#setTitle').value.trim() || 'Futsal UNSS',
          'config/format': $('#setFormat').value.trim(),
          'config/faultThreshold': Math.max(1, parseInt($('#setThr').value, 10) || 3),
          'config/criteria': critEdit.map(c => ({ id: c.id, emoji: c.emoji || '', label: c.label, points: Number(c.points) || 0, goal: !!c.goal }))
        });
        toast('Réglages enregistrés', 'ok'); break;
      }
    }
  } catch (err) {
    console.error(err);
    if (S.view === 'tablette' && /permission/i.test((err && (err.code || err.message)) || '')) tabletLogout('Code expiré : entrez le nouveau code.');
    else toast('Erreur : ' + ((err && err.message) || err), 'bad');
  }
});

/* ---------------- Démarrage ---------------- */
route();
const savedCode = sessionStorage.getItem('futsalTabCode');
if (savedCode && S.view === 'tablette') tabletLogin(savedCode);
</script>
</body>
</html>
